name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1' # weekly, catches breaking upstream releases

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.stability }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*']
        stability: [prefer-stable]
        include:
          - laravel: '10.*'
            testbench: '8.*'
            pest: '^2.0'
          - laravel: '11.*'
            testbench: '9.*'
            pest: '^3.0'
          - laravel: '12.*'
            testbench: '10.*'
            pest: '^3.0'
          # Lowest dependencies on the newest supported combination.
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            pest: '^3.0'
            stability: prefer-lowest
        exclude:
          - php: '8.1'
            laravel: '11.*'
          - php: '8.1'
            laravel: '12.*'

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, exif, mbstring, imagick, zip
          coverage: none
          tools: composer:v2

      - name: Allow end-of-life Laravel 10 / 11
        if: matrix.laravel == '10.*' || matrix.laravel == '11.*'
        # Every Laravel 10 and 11 release now carries security advisories (EOL),
        # which Composer blocks by default. Only relaxed for these compatibility jobs.
        run: composer config policy.advisories.block false || composer config audit.block-insecure false

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-progress -W

      - name: Installed versions
        run: |
          for package in laravel/framework intervention/image orchestra/testbench pestphp/pest league/flysystem-aws-s3-v3; do
            composer show "$package" | grep -E '^(name|versions)'
          done

      - name: Build AWS Emulator image
        run: docker build --tag media-upload-aws-emulator docker/aws-emulator

      - name: Run tests (with S3 on AWS Emulator)
        env:
          AWS_EMULATOR_SKIP_BUILD: '1'
          MEDIA_UPLOAD_REQUIRE_S3: '1'
        run: bash tests/run-s3-tests.sh --colors=always

  audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: fileinfo, gd, exif
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer audit
